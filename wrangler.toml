name = "infonet-concierge"
main = "workers/concierge-ai.js"
compatibility_date = "2026-08-14"

[ai]
binding = "AI"

[vars]
CONCIERGE_CORPUS_URL = "https://lincolnkerry.github.io/ai-homepage/concierge-corpus.json"
MODEL_DEFAULT = "@cf/openai/gpt-oss-120b"
MODEL_LONG = "@cf/zai-org/glm-4.7-flash"
MODEL_CHEAP = "@cf/qwen/qwen3-30b-a3b-fp8"
MODEL_FALLBACK_ORDER = "default,long,cheap"
LONG_PROMPT_CHARS = "40000"
AI_GATEWAY_ID = "infonet-concierge"
CONCIERGE_ORIGIN = ""
